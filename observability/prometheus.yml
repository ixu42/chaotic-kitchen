global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Web board runs on the host (run_kitchen.py / web/main.py)
  - job_name: chaotic-kitchen-web
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
